<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cinema Hub — Stream the stories you love</title>
<meta name="description" content="Cinema Hub — a dark, cinematic streaming-style catalog. Browse, search and discover films, then watch legally on your favourite platforms." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#08090d;
    --bg-2:#0d1017;
    --surface:#141823;
    --surface-2:#1b2130;
    --line:rgba(255,255,255,.09);
    --line-2:rgba(255,255,255,.16);
    --text:#f3f5f9;
    --muted:#9aa4b6;
    --muted-2:#6f7a8d;
    --brand:#8b5cf6;
    --brand-2:#6366f1;
    --gold:#f5c518;
    --radius:14px;
    --shadow:0 18px 50px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(99,102,241,.16), transparent 60%),
      radial-gradient(900px 500px at 0% 10%, rgba(139,92,246,.12), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  .wrap{max-width:1280px;margin:0 auto;padding:0 26px;}

  /* ================= Header ================= */
  header.top{
    position:sticky;top:0;z-index:60;
    background:linear-gradient(180deg, rgba(8,9,13,.96), rgba(8,9,13,.72));
    backdrop-filter:blur(14px) saturate(150%);
    border-bottom:1px solid var(--line);
  }
  .top-inner{display:flex;align-items:center;gap:26px;padding:14px 26px;max-width:1280px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;letter-spacing:-.02em;flex:0 0 auto;}
  .brand .mark{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    box-shadow:0 6px 18px rgba(99,102,241,.45);
  }
  .brand .txt{background:linear-gradient(90deg,#fff,#c9c2ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  nav.main{display:flex;gap:4px;margin-left:6px;}
  nav.main button{
    background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;
    padding:8px 13px;border-radius:9px;transition:.15s;
  }
  nav.main button:hover{color:var(--text);background:rgba(255,255,255,.06);}
  nav.main button.active{color:var(--text);background:rgba(255,255,255,.09);}
  .search{margin-left:auto;position:relative;flex:1;max-width:340px;}
  .search input{
    width:100%;padding:10px 14px 10px 40px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);
    border-radius:11px;font-size:14px;color:var(--text);outline:none;transition:.15s;
  }
  .search input::placeholder{color:var(--muted-2);}
  .search input:focus{border-color:var(--brand);background:rgba(255,255,255,.08);box-shadow:0 0 0 4px rgba(139,92,246,.18);}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);}

  /* ================= Hero ================= */
  .hero{position:relative;margin:0 0 6px;}
  .hero-bg{position:absolute;inset:0;overflow:hidden;}
  .hero-bg svg{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-bg::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg, rgba(8,9,13,.96) 0%, rgba(8,9,13,.82) 34%, rgba(8,9,13,.25) 66%, rgba(8,9,13,.7) 100%),
               linear-gradient(0deg, var(--bg) 2%, transparent 45%);
  }
  .hero-inner{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:74px 26px 58px;min-height:440px;display:flex;flex-direction:column;justify-content:flex-end;}
  .badge{
    display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:#d8d2ff;background:rgba(139,92,246,.18);border:1px solid rgba(139,92,246,.4);
    padding:6px 12px;border-radius:999px;width:max-content;margin-bottom:16px;
  }
  .hero h1{margin:0 0 12px;font-size:clamp(30px,5vw,58px);line-height:1.02;letter-spacing:-.035em;max-width:760px;text-shadow:0 4px 30px rgba(0,0,0,.5);}
  .hero-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14.5px;margin-bottom:14px;font-weight:600;}
  .hero-meta .rate{color:var(--gold);font-weight:800;}
  .hero-meta .dotsep{width:4px;height:4px;border-radius:50%;background:var(--muted-2);}
  .hero p.syn{max-width:600px;color:#c7cede;font-size:15px;margin:0 0 24px;}
  .hero-actions{display:flex;gap:12px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:9px;border:0;cursor:pointer;font-size:14.5px;font-weight:700;
    padding:12px 22px;border-radius:11px;transition:.16s;
  }
  .btn svg{width:18px;height:18px;}
  .btn-play{background:#fff;color:#0a0b10;}
  .btn-play:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(255,255,255,.22);}
  .btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid var(--line-2);backdrop-filter:blur(6px);}
  .btn-ghost:hover{background:rgba(255,255,255,.2);}
  .hero-dots{display:flex;gap:8px;margin-top:26px;}
  .hero-dots i{width:26px;height:4px;border-radius:99px;background:rgba(255,255,255,.22);cursor:pointer;transition:.2s;}
  .hero-dots i.on{background:var(--brand);width:40px;}

  /* ================= Rows ================= */
  .rows{padding:10px 0 70px;}
  .row{margin:34px 0;}
  .row-head{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;}
  .row-head h2{margin:0;font-size:20px;letter-spacing:-.02em;}
  .row-head .count{color:var(--muted-2);font-size:13px;font-weight:600;}
  .row-scroll-wrap{position:relative;}
  .row-scroller{
    display:flex;gap:16px;overflow-x:auto;scroll-behavior:smooth;padding:6px 2px 14px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .row-scroller::-webkit-scrollbar{display:none;}
  .arrow{
    position:absolute;top:50%;transform:translateY(-60%);z-index:5;width:40px;height:40px;border-radius:50%;
    border:1px solid var(--line-2);background:rgba(14,16,24,.85);color:#fff;cursor:pointer;display:grid;place-items:center;
    backdrop-filter:blur(6px);opacity:0;transition:.18s;
  }
  .row-scroll-wrap:hover .arrow{opacity:1;}
  .arrow:hover{background:var(--brand);border-color:var(--brand);}
  .arrow.left{left:-6px;}
  .arrow.right{right:-6px;}
  .arrow svg{width:18px;height:18px;}

  /* ================= Card ================= */
  .card{flex:0 0 172px;width:172px;cursor:pointer;}
  .grid-view .card{flex:1 1 auto;width:auto;}
  .thumb{
    position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:var(--surface);
    border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.4);
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s;
  }
  .thumb svg{width:100%;height:100%;display:block;}
  .card:hover .thumb{transform:translateY(-6px) scale(1.03);box-shadow:var(--shadow);border-color:var(--line-2);}
  .thumb .rate{
    position:absolute;top:9px;left:9px;display:flex;align-items:center;gap:4px;
    background:rgba(8,9,13,.72);backdrop-filter:blur(6px);color:var(--gold);font-size:12px;font-weight:800;
    padding:4px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.12);
  }
  .thumb .add{
    position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.28);
    background:rgba(8,9,13,.6);backdrop-filter:blur(6px);color:#fff;cursor:pointer;display:grid;place-items:center;
    font-size:16px;line-height:1;opacity:0;transition:.18s;
  }
  .card:hover .thumb .add{opacity:1;}
  .thumb .add:hover{background:#fff;color:#0a0b10;}
  .thumb .add.on{background:var(--brand);border-color:var(--brand);opacity:1;}
  .card-title{margin:11px 2px 2px;font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-sub{margin:0 2px;font-size:12.5px;color:var(--muted-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ================= Results grid ================= */
  .results-head{padding:34px 0 6px;}
  .results-head h2{margin:0;font-size:24px;letter-spacing:-.02em;}
  .results-head p{margin:6px 0 0;color:var(--muted);font-size:14px;}
  .grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:20px;padding:22px 0 70px;}

  .empty{text-align:center;padding:80px 20px;color:var(--muted);}
  .empty b{display:block;color:var(--text);font-size:19px;margin-bottom:8px;}

  /* ================= Detail modal ================= */
  .overlay{
    position:fixed;inset:0;z-index:100;display:none;justify-content:center;align-items:flex-start;
    background:rgba(4,5,8,.78);backdrop-filter:blur(6px);overflow-y:auto;padding:34px 16px;
  }
  .overlay.open{display:flex;}
  .sheet{
    position:relative;width:100%;max-width:860px;margin:auto;background:var(--bg-2);border:1px solid var(--line);
    border-radius:22px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.7);animation:rise .26s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{from{opacity:0;transform:translateY(24px) scale(.985);}to{opacity:1;transform:none;}}
  .sheet-bg{position:relative;height:280px;overflow:hidden;}
  .sheet-bg svg{width:100%;height:100%;display:block;}
  .sheet-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg-2) 4%, rgba(13,16,23,.5) 55%, rgba(13,16,23,.15) 100%);}
  .sheet-close{
    position:absolute;top:16px;right:16px;z-index:6;width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);
    background:rgba(8,9,13,.7);backdrop-filter:blur(6px);color:#fff;font-size:19px;cursor:pointer;display:grid;place-items:center;
  }
  .sheet-close:hover{background:#fff;color:#0a0b10;}
  .sheet-body{position:relative;z-index:3;margin-top:-96px;padding:0 34px 32px;display:flex;gap:28px;}
  .sheet-poster{flex:0 0 190px;width:190px;aspect-ratio:2/3;border-radius:16px;overflow:hidden;border:1px solid var(--line-2);box-shadow:0 22px 50px rgba(0,0,0,.6);background:var(--surface);}
  .sheet-poster svg{width:100%;height:100%;display:block;}
  .sheet-info{flex:1;min-width:0;padding-top:104px;}
  .sheet-info h2{margin:0 0 10px;font-size:30px;letter-spacing:-.03em;line-height:1.05;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{font-size:11.5px;font-weight:700;letter-spacing:.03em;color:#d6d0ff;background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.34);padding:4px 11px;border-radius:999px;text-transform:uppercase;}
  .factline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px;font-weight:600;margin-bottom:16px;}
  .factline .rate{color:var(--gold);font-weight:800;display:flex;align-items:center;gap:5px;}
  .factline .dotsep{width:4px;height:4px;border-radius:50%;background:var(--muted-2);}
  .sheet-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .sheet-section{margin-top:22px;}
  .sheet-section h4{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);}
  .sheet-section p{margin:0;color:#c7cede;font-size:15px;line-height:1.65;}
  .castlist{display:flex;gap:8px;flex-wrap:wrap;}
  .castlist span{background:var(--surface-2);border:1px solid var(--line);padding:6px 13px;border-radius:999px;font-size:13px;color:#dfe4ee;}
  .where{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .where .pw{
    display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
    padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:600;transition:.15s;
  }
  .where .pw:hover{border-color:var(--brand);background:rgba(139,92,246,.14);}
  .legal-note{font-size:12px;color:var(--muted-2);margin-top:10px;}

  /* ================= Footer ================= */
  footer{border-top:1px solid var(--line);margin-top:20px;padding:34px 0 46px;color:var(--muted-2);font-size:13px;}
  .foot-inner{max-width:1280px;margin:0 auto;padding:0 26px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center;}
  .foot-inner b{color:var(--muted);}

  @media (max-width:760px){
    .wrap,.top-inner,.hero-inner,.foot-inner{padding-left:16px;padding-right:16px;}
    nav.main{display:none;}
    .hero-inner{padding-top:52px;min-height:380px;}
    .sheet-body{flex-direction:column;gap:18px;margin-top:-70px;padding:0 20px 26px;}
    .sheet-poster{flex-basis:auto;width:150px;}
    .sheet-info{padding-top:0;}
    .sheet-bg{height:220px;}
    .card{flex-basis:142px;width:142px;}
    .arrow{display:none;}
  }
</style>
</head>

   synopsis:"In a scorched wasteland, a drifter and a rebel commander flee a tyrant across the desert in one relentless, roaring chase for freedom.",

/* ============================================================
   2. Poster / backdrop art (generated SVG — no external images)
   ============================================================ */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function initials(t){
  const w=t.replace(/[^A-Za-z0-9 ]/g," ").trim().split(/\s+/);
  return w.length===1 ? w[0].slice(0,2).toUpperCase() : (w[0][0]+w[1][0]).toUpperCase();
}
function posterSVG(m, i){
  const [c1,c2]=m.colors, id="p"+i;
  const art = i%3===0
    ? `<circle cx="150" cy="95" r="118" fill="rgba(255,255,255,.09)"/><circle cx="38" cy="322" r="86" fill="rgba(255,255,255,.06)"/>`
    : i%3===1
    ? `<rect x="-50" y="52" width="330" height="52" fill="rgba(255,255,255,.075)" transform="rotate(-17 120 78)"/><rect x="-50" y="196" width="330" height="52" fill="rgba(255,255,255,.055)" transform="rotate(-17 120 222)"/>`
    : `<polygon points="0,300 100,150 200,300" fill="rgba(255,255,255,.07)"/><polygon points="0,300 100,215 200,300" fill="rgba(255,255,255,.05)"/>`;
  const t = m.title.length>24 ? m.title.split(" ").slice(0,3).join(" ") : m.title;
  return `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(m.title)}">
    <defs>
      <linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>
      <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,.62)"/></linearGradient>
    </defs>
    <rect width="200" height="300" fill="url(#${id})"/>${art}
    <rect width="200" height="300" fill="url(#${id}s)"/>
    <text x="18" y="118" font-family="Georgia,'Times New Roman',serif" font-size="74" font-weight="700" fill="rgba(255,255,255,.28)">${esc(initials(m.title))}</text>
    <text x="18" y="250" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14.5" font-weight="700" fill="#fff">${esc(t)}</text>
    <text x="18" y="272" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,.78)">${m.year} &middot; ${esc(m.genres[0])}</text>
  </svg>`;
}
function backdropSVG(m, i){
  const [c1,c2]=m.colors, id="b"+i;
  return `<svg viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <rect width="1200" height="500" fill="url(#${id})"/>
    <circle cx="950" cy="130" r="260" fill="rgba(255,255,255,.07)"/>
    <circle cx="1080" cy="400" r="180" fill="rgba(255,255,255,.05)"/>
    <text x="640" y="400" font-family="Georgia,'Times New Roman',serif" font-size="320" font-weight="700" fill="rgba(255,255,255,.06)">${esc(initials(m.title))}</text>
  </svg>`;
}

/* ============================================================
   3. Links — legal only
   ============================================================ */
function trailerUrl(m){return "https://www.youtube.com/results?search_query="+encodeURIComponent(m.title+" "+m.year+" official trailer");}
function whereUrl(m){return "https://www.justwatch.com/in/search?q="+encodeURIComponent(m.title);}

/* ============================================================
   4. State
   ============================================================ */
const $=s=>document.querySelector(s);
const rowsEl=$("#rows"), homeEl=$("#home"), resultsEl=$("#results"), qEl=$("#q");
let query="", view="home";
let myList=new Set();
try{ myList=new Set(JSON.parse(localStorage.getItem("cinemahub_list")||"[]")); }catch(e){}
function saveList(){ try{localStorage.setItem("cinemahub_list", JSON.stringify([...myList]));}catch(e){} }

/* ============================================================
   5. Hero (rotating)
   ============================================================ */
const featured = MOVIES.filter(m=>m.trend).slice(0,4);
let heroIdx=0, heroTimer=null;
function renderHero(){
  const m=featured[heroIdx], i=MOVIES.indexOf(m);
  $("#heroBg").innerHTML=backdropSVG(m,i);
  $("#heroInner").innerHTML=`
    <span class="badge">&#9733; Featured Film</span>
    <h1>${esc(m.title)}</h1>
    <div class="hero-meta">
      <span class="rate">&#9733; ${m.rating.toFixed(1)}</span>
      <span class="dotsep"></span><span>${m.year}</span>
      <span class="dotsep"></span><span>${m.runtime} min</span>
      <span class="dotsep"></span><span>${esc(m.genres.join(" · "))}</span>
    </div>
    <p class="syn">${esc(m.synopsis)}</p>
    <div class="hero-actions">
      <a class="btn btn-play" href="${trailerUrl(m)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Watch Trailer</a>
      <button class="btn btn-ghost" onclick="openDetail(MOVIES[${i}])">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>More Info</button>
      <button class="btn btn-ghost" onclick="toggleList(${i},this)">
        <span>${myList.has(i)?"&#10003; In My List":"&#43; My List"}</span></button>
    </div>
    <div class="hero-dots">${featured.map((_,k)=>`<i class="${k===heroIdx?"on":""}" onclick="setHero(${k})"></i>`).join("")}</div>`;
}
function setHero(k){heroIdx=k;renderHero();restartHero();}
function restartHero(){clearInterval(heroTimer);heroTimer=setInterval(()=>{heroIdx=(heroIdx+1)%featured.length;renderHero();},6500);}
$("#hero").addEventListener("mouseenter",()=>clearInterval(heroTimer));
$("#hero").addEventListener("mouseleave",restartHero);

/* ============================================================
   6. Cards + rows
   ============================================================ */
function cardHTML(m){
  const i=MOVIES.indexOf(m);
  return `<article class="card" onclick="openDetail(MOVIES[${i}])">
    <div class="thumb">
      ${posterSVG(m,i)}
      <span class="rate">&#9733; ${m.rating.toFixed(1)}</span>
      <button class="add ${myList.has(i)?"on":""}" title="My List" onclick="event.stopPropagation();toggleList(${i},this)">${myList.has(i)?"&#10003;":"&#43;"}</button>
    </div>
    <div class="card-title">${esc(m.title)}</div>
    <div class="card-sub">${m.year} &middot; ${esc(m.genres[0])}</div>
  </article>`;
}
const ROWS=[
  {title:"Trending Now", pick:ms=>ms.filter(m=>m.trend)},
  {title:"Top Rated", pick:ms=>ms.filter(m=>m.rating>=8.4)},
  {title:"Made in India", pick:ms=>ms.filter(m=>m.region==="India")},
  {title:"Sci-Fi & Fantasy", pick:ms=>ms.filter(m=>m.genres.some(g=>["Sci-Fi","Fantasy","Adventure"].includes(g)))},
  {title:"Thrills & Crime", pick:ms=>ms.filter(m=>m.genres.includes("Thriller"))},
  {title:"Family & Animation", pick:ms=>ms.filter(m=>m.genres.some(g=>["Animation","Family"].includes(g)))}
];
function renderRows(){
  const list=[];
  if(myList.size){
    list.push({title:"My List", items:[...myList].map(i=>MOVIES[i]).filter(Boolean)});
  }
  ROWS.forEach(r=>{const items=r.pick(MOVIES); if(items.length) list.push({title:r.title, items});});
  rowsEl.innerHTML=list.map((r,ri)=>`
    <section class="row">
      <div class="row-head"><h2>${esc(r.title)}</h2><span class="count">${r.items.length} titles</span></div>
      <div class="row-scroll-wrap">
        <button class="arrow left" onclick="scrollRow(${ri},-1)" aria-label="Scroll left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="row-scroller" id="row-${ri}">${r.items.map(cardHTML).join("")}</div>
        <button class="arrow right" onclick="scrollRow(${ri},1)" aria-label="Scroll right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </section>`).join("");
}
function scrollRow(i,dir){
  const el=document.getElementById("row-"+i);
  if(el) el.scrollBy({left:dir*Math.max(320,el.clientWidth*0.8),behavior:"smooth"});
}

/* ============================================================
   7. Search / results
   ============================================================ */
function matches(m){
  const q=query.toLowerCase();
  return m.title.toLowerCase().includes(q)||m.director.toLowerCase().includes(q)
    ||m.genres.join(" ").toLowerCase().includes(q)||m.cast.join(" ").toLowerCase().includes(q)
    ||String(m.year).includes(q)||m.language.toLowerCase().includes(q);
}
function showResults(title, items, sub){
  homeEl.style.display="none"; $("#hero").style.display="none";
  resultsEl.style.display="block";
  $("#resTitle").textContent=title; $("#resSub").textContent=sub||"";
  $("#resEmpty").style.display=items.length?"none":"block";
  $("#resGrid").innerHTML=items.map(cardHTML).join("");
}
function goHome(){
  view="home"; query=""; qEl.value="";
  resultsEl.style.display="none"; homeEl.style.display="block"; $("#hero").style.display="block";
  setNav("home"); renderRows(); renderHero();
}
function setNav(name){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.nav===name));}
$("#nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const n=b.dataset.nav;
  if(n==="home"){goHome();return;}
  if(n==="movies"){setNav("movies");showResults("All Films",MOVIES,"The complete Cinema Hub catalog.");window.scrollTo({top:0});return;}
  if(n==="mylist"){
    setNav("mylist");
    const items=[...myList].map(i=>MOVIES[i]).filter(Boolean);
    showResults("My List",items, items.length?"Saved titles.":"Nothing saved yet — tap + on any poster.");
    window.scrollTo({top:0});return;
  }
});
let qt;
qEl.addEventListener("input",e=>{
  clearTimeout(qt);
  qt=setTimeout(()=>{
    query=e.target.value.trim();
    if(!query){goHome();return;}
    setNav("");
    showResults('Search: "'+query+'"', MOVIES.filter(matches), MOVIES.filter(matches).length+" result(s)");
    window.scrollTo({top:0});
  },130);
});

/* ============================================================
   8. My List
   ============================================================ */
function toggleList(i,btn){
  if(myList.has(i)) myList.delete(i); else myList.add(i);
  saveList();
  if(btn && btn.classList.contains("add")){
    btn.classList.toggle("on",myList.has(i));
    btn.innerHTML=myList.has(i)?"&#10003;":"&#43;";
  } else if(btn && btn.tagName==="BUTTON" && btn.querySelector("span")){
    btn.querySelector("span").innerHTML=myList.has(i)?"&#10003; In My List":"&#43; My List";
  }
  renderRows();
  if(view==="mylist"){}
  document.querySelectorAll(".add").forEach(a=>{});
}

/* ============================================================
   9. Detail sheet
   ============================================================ */
const overlay=$("#overlay"), sheet=$("#sheet");
function openDetail(m){
  const i=MOVIES.indexOf(m);
  sheet.innerHTML=`
    <div class="sheet-bg">${backdropSVG(m,i)}</div>
    <button class="sheet-close" onclick="closeDetail()" aria-label="Close">&times;</button>
    <div class="sheet-body">
      <div class="sheet-poster">${posterSVG(m,i)}</div>
      <div class="sheet-info">
        <h2>${esc(m.title)}</h2>
        <div class="chips">${m.genres.map(g=>`<span class="chip">${esc(g)}</span>`).join("")}</div>
        <div class="factline">
          <span class="rate">&#9733; ${m.rating.toFixed(1)}</span>
          <span class="dotsep"></span><span>${m.year}</span>
          <span class="dotsep"></span><span>${m.runtime} min</span>
          <span class="dotsep"></span><span>${esc(m.language)}</span>
        </div>
        <div class="sheet-actions">
          <a class="btn btn-play" href="${trailerUrl(m)}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Watch Trailer</a>
          <a class="btn btn-ghost" href="${whereUrl(m)}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18v14H3z"/><path d="M3 9h18"/></svg>Where to Watch</a>
          <button class="btn btn-ghost" onclick="toggleList(${i},this)">
            <span>${myList.has(i)?"&#10003; In My List":"&#43; My List"}</span></button>
        </div>
      </div>
    </div>
    <div class="sheet-body" style="margin-top:0;flex-direction:column;gap:0;">
      <div class="sheet-section"><h4>Synopsis</h4><p>${esc(m.synopsis)}</p></div>
      <div class="sheet-section"><h4>Director</h4><p>${esc(m.director)}</p></div>
      <div class="sheet-section"><h4>Cast</h4><div class="castlist">${m.cast.map(c=>`<span>${esc(c)}</span>`).join("")}</div></div>
      <div class="sheet-section">
        <h4>Where to Watch (legal platforms)</h4>
        <div class="where">
          <a class="pw" href="${whereUrl(m)}" target="_blank" rel="noopener">JustWatch &mdash; all legal options</a>
          <a class="pw" href="https://www.netflix.com/search?q=${encodeURIComponent(m.title)}" target="_blank" rel="noopener">Netflix</a>
          <a class="pw" href="https://www.primevideo.com/search/ref=atv_nb_sr?phrase=${encodeURIComponent(m.title)}" target="_blank" rel="noopener">Prime Video</a>
          <a class="pw" href="https://www.hotstar.com/in/search?q=${encodeURIComponent(m.title)}" target="_blank" rel="noopener">JioHotstar</a>
        </div>
        <div class="legal-note">Cinema Hub links only to official platforms. No pirated streams or downloads.</div>
      </div>
    </div>`;
  overlay.classList.add("open");
  document.body.style.overflow="hidden";
}
function closeDetail(){overlay.classList.remove("open");document.body.style.overflow="";}
overlay.addEventListener("click",e=>{if(e.target===overlay)closeDetail();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail();});

/* ============================================================
   10. Init
   ============================================================ */
renderHero(); restartHero(); renderRows();
</script>
</body>
</html>
